<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ML LLM Digests</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0b1020;
        --panel: #121a33;
        --text: #e8edff;
        --muted: #9fb0df;
        --accent: #6ea8ff;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f5f8ff;
          --panel: #ffffff;
          --text: #1c2847;
          --muted: #4f618f;
          --accent: #2f63d8;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }
      main {
        max-width: 900px;
        margin: 48px auto;
        padding: 0 20px;
      }
      .card {
        background: var(--panel);
        border-radius: 14px;
        padding: 24px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.18);
      }
      h1 { margin-top: 0; font-size: 2rem; }
      p { color: var(--muted); }
      .status {
        margin-top: 18px;
        padding: 12px 14px;
        border-left: 4px solid var(--accent);
        background: rgba(110,168,255,0.12);
        border-radius: 8px;
        color: var(--text);
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.92em;
      }
      ul { color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <h1>ML LLM Digests</h1>
        <p>Vertical-slice local test page for the static website deployment.</p>

        <div class="status">
          ✅ Static root page is live.
        </div>

        <h2>Next steps (slice expansion)</h2>
        <ul>
          <li>Add SQLite-backed search bootstrap (<code>sql.js + HTTP VFS</code>).</li>
          <li>Wire results list and paper detail navigation.</li>
          <li>Package assets for <code>aws s3 sync</code> deployment.</li>
        </ul>
      </section>
    </main>
  </body>
</html>
