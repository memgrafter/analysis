<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/mldigest.ico" type="image/x-icon" />
    <title>ML LLM Digests</title>
    <meta name="description" content="Browse and search ML paper digests from arXiv." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ML Digest" />
    <meta property="og:title" content="ML Digest" />
    <meta property="og:description" content="Browse and search ML paper digests from arXiv." />
    <meta property="og:url" content="https://ml-digest.ftl.cc/" />
    <meta property="og:image" content="https://ml-digest.ftl.cc/mldigest.ico" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ML Digest" />
    <meta name="twitter:description" content="Browse and search ML paper digests from arXiv." />
    <meta name="twitter:image" content="https://ml-digest.ftl.cc/mldigest.ico" />
    <meta http-equiv="refresh" content="0; url=/search/" />
    <script>
      window.location.replace("/search/");
    </script>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0b1020;
        --panel: #121a33;
        --text: #e8edff;
        --muted: #9fb0df;
        --accent: #6ea8ff;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f5f8ff;
          --panel: #ffffff;
          --text: #1c2847;
          --muted: #4f618f;
          --accent: #2f63d8;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }
      main {
        max-width: 900px;
        margin: 48px auto;
        padding: 0 20px;
      }
      .card {
        background: var(--panel);
        border-radius: 14px;
        padding: 24px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.18);
      }
      h1 { margin-top: 0; font-size: 2rem; }
      p { color: var(--muted); }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.92em;
      }
      ul { color: var(--muted); }
      a { color: var(--accent); text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <h1>ML LLM Digests</h1>
        <p>Static local viewer routes:</p>
        <ul>
          <li><code>/view?id=&lt;digest-id&gt;</code></li>
          <li><code>/view/?id=&lt;digest-id&gt;</code></li>
          <li><code>/view/&lt;digest-id&gt;.md</code> (raw markdown)</li>
          <li><code>/search/?q=&lt;query&gt;</code> (SQLite search vertical slice)</li>
          <li><code>/cloud/</code> (yearly term cloud)</li>
        </ul>
        <p><a href="/view/">Open viewer</a> · <a href="/search/">Open search</a> · <a href="/cloud/">Open cloud</a></p>
      </section>
    </main>
    <script src="/assets/shared-header.js"></script>
  </body>
</html>
