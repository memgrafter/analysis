<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/mldigest.ico" type="image/x-icon" />
    <title>View Digest</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&display=swap");

      :root {
        color-scheme: light dark;
        --font-sans: "Cabin", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        --font-mono: "Cabin", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        --bg: #f5f7ff;
        --panel: #ffffff;
        --text: #1a2440;
        --muted: #5d6f9a;
        --border: #dbe2f4;
        --accent: #2f63d8;
        --code-bg: rgba(127, 127, 127, 0.12);
        --yaml-key: #0b57d0;
        --yaml-value: #1f5f34;
        --yaml-punct: #6b7280;
        --yaml-comment: #8b5cf6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1020;
          --panel: #121a33;
          --text: #e8edff;
          --muted: #a8b4da;
          --border: #27335f;
          --accent: #6ea8ff;
          --code-bg: rgba(180, 195, 230, 0.12);
          --yaml-key: #8ab4ff;
          --yaml-value: #8ce99a;
          --yaml-punct: #b7c0da;
          --yaml-comment: #c4b5fd;
        }
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: var(--font-sans);
        background: var(--bg);
        color: var(--text);
      }
      header,
      main,
      footer {
        max-width: 980px;
        margin: 0 auto;
        padding-left: 16px;
        padding-right: 16px;
      }
      header {
        padding-top: 0;
        padding-bottom: 0;
      }
      main {
        padding-top: 0;
        padding-bottom: 24px;
      }
      footer {
        padding-top: 0;
        padding-bottom: 24px;
      }
      #status {
        color: var(--muted);
        margin: 0;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
      }
      .panel > :first-child { margin-top: 0; }
      .panel > :last-child { margin-bottom: 0; }
      .search-jump {
        margin-top: 14px;
      }
      .search-jump h2 {
        margin: 0 0 10px;
        font-size: 22px;
        line-height: 1.2;
      }
      .search-jump form {
        display: grid;
        gap: 10px;
      }
      .search-jump .search-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
      }
      .search-jump input[type="search"] {
        width: 100%;
        border: 1px solid var(--border);
        background: transparent;
        color: inherit;
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 16px;
      }
      .search-jump input[type="search"]::-webkit-search-cancel-button {
        -webkit-appearance: none;
        appearance: none;
        display: none;
      }
      .search-jump button {
        border: 1px solid var(--border);
        background: var(--accent);
        color: white;
        border-radius: 10px;
        padding: 10px 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .search-jump .filters {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 10px;
      }
      .search-jump .filters fieldset {
        margin: 0;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 10px 10px;
      }
      .search-jump .filters legend {
        padding: 0 6px;
        color: var(--muted);
        font-size: 12px;
      }
      .search-jump .filter-options {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .search-jump .filter-options label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--muted);
      }
      .search-jump .filter-options label.disabled-filter {
        opacity: 0.65;
        cursor: not-allowed;
      }
      .search-jump .filter-options label.disabled-filter input {
        cursor: not-allowed;
      }
      .frontmatter {
        margin-bottom: 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: color-mix(in oklab, var(--panel), var(--bg) 16%);
      }
      .frontmatter summary {
        cursor: pointer;
        user-select: none;
        padding: 10px 12px;
        color: var(--muted);
        font-weight: 600;
      }
      .frontmatter pre {
        margin: 0;
        padding: 12px;
        border-top: 1px solid var(--border);
        overflow-x: auto;
        background: var(--code-bg);
      }
      .filename-row {
        padding: 10px 12px;
        border-top: 1px solid var(--border);
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--muted);
      }
      .yaml-code {
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.45;
        white-space: pre;
      }
      .yaml-key {
        color: var(--yaml-key);
      }
      .yaml-value {
        color: var(--yaml-value);
      }
      .yaml-punct {
        color: var(--yaml-punct);
      }
      .yaml-comment {
        color: var(--yaml-comment);
      }
      #digest-title {
        margin: 0 0 16px;
        font-size: 28px;
        line-height: 1.2;
      }

      .markdown-body {
        font-size: 16px;
        line-height: 1.72;
        overflow-wrap: anywhere;
      }
      .markdown-body h1,
      .markdown-body h2,
      .markdown-body h3,
      .markdown-body h4 {
        line-height: 1.3;
        margin: 1.4em 0 0.6em;
      }
      .markdown-body h1 {
        font-size: 1.75rem;
      }
      .markdown-body h2 {
        font-size: 1.4rem;
      }
      .markdown-body h3 {
        font-size: 1.2rem;
      }
      .markdown-body p,
      .markdown-body ul,
      .markdown-body ol,
      .markdown-body blockquote,
      .markdown-body table,
      .markdown-body pre {
        margin: 0.8em 0;
      }
      .markdown-body a {
        color: var(--accent);
      }
      .markdown-body code {
        font-family: var(--font-mono);
        background: var(--code-bg);
        padding: 0.1em 0.32em;
        border-radius: 6px;
      }
      .markdown-body pre {
        background: var(--code-bg);
        border-radius: 8px;
        padding: 12px;
        overflow-x: auto;
      }
      .markdown-body pre code {
        background: transparent;
        padding: 0;
      }
      .markdown-body blockquote {
        border-left: 4px solid var(--border);
        padding-left: 12px;
        color: var(--muted);
      }
      .markdown-body table {
        width: 100%;
        border-collapse: collapse;
      }
      .markdown-body th,
      .markdown-body td {
        border: 1px solid var(--border);
        padding: 6px 8px;
        text-align: left;
      }
      .error {
        color: #cc3b3b;
        font-weight: 600;
      }
      footer {
        color: var(--muted);
        font-size: 13px;
      }
      code {
        font-family: var(--font-mono);
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </head>
  <body>
    <header>
      <p id="status">Loading…</p>
    </header>

    <main>
      <article class="panel">
        <details id="frontmatter-details" class="frontmatter" hidden>
          <summary>YAML frontmatter</summary>
          <pre><code id="frontmatter-code" class="yaml-code"></code></pre>
          <div id="filename-row" class="filename-row"></div>
        </details>

        <h1 id="digest-title">Loading…</h1>
        <div id="content" class="markdown-body"></div>
      </article>

      <section class="panel search-jump">
        <h2>arXiv ML Digest Search</h2>
        <form action="/search/" method="get">
          <div class="search-row">
            <input type="search" name="q" placeholder="Try: transformers, retrieval, 2404.18923" autocomplete="off" />
            <button type="submit">Search</button>
          </div>

          <div class="filters">
            <fieldset>
              <legend>Year</legend>
              <div class="filter-options">
                <label><input type="checkbox" name="y" value="2023" checked /> 2023</label>
                <label><input type="checkbox" name="y" value="2024" checked /> 2024</label>
                <label><input type="checkbox" name="y" value="2025" checked /> 2025</label>
              </div>
            </fieldset>

            <fieldset>
              <legend>Search Scope</legend>
              <div class="filter-options">
                <label class="disabled-filter" title="Title is always included in Search Scope."><input type="checkbox" name="f" value="title" checked disabled /> Title</label>
                <label title="Search Scope is progressive: Full text includes Core contribution, and Core contribution includes Title."><input type="checkbox" name="f" value="core" checked /> Core contribution</label>
                <label title="Search Scope is progressive: Full text includes Core contribution, and Core contribution includes Title."><input type="checkbox" name="f" value="body" checked /> Full text (body)</label>
              </div>
            </fieldset>
          </div>
        </form>
      </section>
    </main>

    <script src="/assets/shared-header.js"></script>
    <script src="/assets/viewer.js"></script>
  </body>
</html>
