<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/mldigest.ico" type="image/x-icon" />
    <title>Search Digests</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f7ff;
        --panel: #ffffff;
        --text: #1a2440;
        --muted: #5d6f9a;
        --border: #dbe2f4;
        --accent: #2f63d8;
        --meta-link: #244fb5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1020;
          --panel: #121a33;
          --text: #e8edff;
          --muted: #a8b4da;
          --border: #27335f;
          --accent: #6ea8ff;
          --meta-link: #5b94f7;
        }
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      main {
        max-width: 980px;
        margin: 32px auto;
        padding: 0 16px 24px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 14px;
      }
      a { color: var(--accent); text-decoration: none; }
      .muted { color: var(--muted); }
      .search-anim {
        margin: 4px 0 0;
        min-height: 6.2em;
        line-height: 1.15;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        white-space: pre;
      }
      form {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        margin: 12px 0;
      }
      .filters {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 10px;
        margin: 0 0 12px;
      }
      .filters fieldset {
        margin: 0;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 10px 10px;
      }
      .filters legend {
        padding: 0 6px;
        color: var(--muted);
        font-size: 12px;
      }
      .filter-options {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .filter-options label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--muted);
      }
      input[type="search"] {
        width: 100%;
        border: 1px solid var(--border);
        background: transparent;
        color: inherit;
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 16px;
      }
      button {
        border: 1px solid var(--border);
        background: var(--accent);
        color: white;
        border-radius: 10px;
        padding: 10px 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button[disabled] {
        opacity: 0.55;
        cursor: not-allowed;
      }
      select {
        border: 1px solid var(--border);
        background: transparent;
        color: inherit;
        border-radius: 10px;
        padding: 8px 10px;
      }
      .pager {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin: 8px 0 18px;
      }
      .pager[hidden] {
        display: none;
      }
      .pager-nav {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .pager-size,
      .pager-sort {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .result {
        border-top: 1px solid var(--border);
        padding: 12px 0;
      }
      .result:first-child { border-top: 0; padding-top: 0; }
      .title { font-weight: 600; }
      .title a {
        color: var(--accent);
      }
      .result-meta-links {
        margin-top: 2px;
        font-size: 11px;
        color: var(--muted);
      }
      .result-meta-links a {
        font-size: 11px;
        color: var(--meta-link);
      }
      .result-takeaway {
        margin-top: 6px;
        font-size: 12px;
        line-height: 1.4;
        color: var(--muted);
        white-space: pre-wrap;
        overflow: visible;
        text-overflow: unset;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
      }
      .pill {
        display: inline-block;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 3px 8px;
        font-size: 12px;
        color: var(--muted);
      }
    </style>
    <script src="/assets/sqljs-httpvfs/index.js"></script>
    <script src="/assets/sqljs/sql-wasm.js"></script>
  </head>
  <body>
    <main>
      <section class="panel">
        <h1>arXiv ML Digest Search</h1>

        <form id="search-form">
          <input id="q" type="search" name="q" placeholder="Try: Latent Reasoning, or by arXiv ID, e.g. 2404.18923" autocomplete="off" />
          <button type="submit">Search</button>
        </form>

        <div class="filters">
          <fieldset>
            <legend>Year</legend>
            <div class="filter-options">
              <label><input type="checkbox" name="year-filter" value="2023" /> 2023</label>
              <label><input type="checkbox" name="year-filter" value="2024" /> 2024</label>
              <label><input type="checkbox" name="year-filter" value="2025" checked /> 2025</label>
            </div>
          </fieldset>

          <fieldset>
            <legend>Search scope</legend>
            <div class="filter-options">
              <label><input type="checkbox" name="scope-filter" value="title" checked /> Title</label>
              <label><input type="checkbox" name="scope-filter" value="core" checked /> Core contribution</label>
              <label><input type="checkbox" name="scope-filter" value="body" /> Full text (body)</label>
            </div>
          </fieldset>
        </div>

        <p id="status" class="muted">Loading search index…</p>
        <p id="search-anim" class="search-anim muted" hidden></p>
        <p id="meta" class="muted"></p>
      </section>

      <section class="panel">
        <div id="pager-top" class="pager" hidden>
          <div class="pager-nav">
            <button id="prev-top" type="button">Prev</button>
            <button id="next-top" type="button">Next</button>
            <span id="page-label-top" class="muted"></span>
          </div>
          <label class="pager-sort muted">
            Sort
            <select id="sort-top" aria-label="Sort results (top)">
              <option value="newest">Newest</option>
              <option value="relevance" selected>Relevance</option>
              <option value="title_asc">Title A→Z</option>
            </select>
          </label>
          <label class="pager-size muted">
            Per page
            <select id="page-size-top" aria-label="Results per page (top)">
              <option value="10">10</option>
              <option value="25">25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </label>
        </div>

        <div id="results"></div>

        <div id="pager-bottom" class="pager" hidden>
          <div class="pager-nav">
            <button id="prev-bottom" type="button">Prev</button>
            <button id="next-bottom" type="button">Next</button>
            <span id="page-label-bottom" class="muted"></span>
          </div>
          <label class="pager-sort muted">
            Sort
            <select id="sort-bottom" aria-label="Sort results (bottom)">
              <option value="newest">Newest</option>
              <option value="relevance" selected>Relevance</option>
              <option value="title_asc">Title A→Z</option>
            </select>
          </label>
          <label class="pager-size muted">
            Per page
            <select id="page-size-bottom" aria-label="Results per page (bottom)">
              <option value="10">10</option>
              <option value="25">25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </label>
        </div>
      </section>
    </main>

    <script src="/assets/search.js"></script>
  </body>
</html>
